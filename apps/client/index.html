<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111a24" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23456b5d'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='34' fill='%23fff0c8'%3E%E4%BA%91%3C/text%3E%3C/svg%3E" />
    <meta name="description" content="赵云与阿斗真人实时对战原型" />
    <meta name="adou-build" content="1.0.9-realtime" />
    <title>赵云与阿斗 · 真人实时对战</title>
  </head>
  <body>
    <section
      id="file-protocol-warning"
      hidden
      style="min-height:100vh;box-sizing:border-box;padding:48px 24px;background:#111a24;color:#f5ead1;font-family:'Microsoft YaHei',sans-serif;text-align:center"
    >
      <div style="max-width:680px;margin:10vh auto;padding:36px;border:1px solid #8f7347;border-radius:20px;background:#182533;box-shadow:0 20px 60px #0007">
        <p style="margin:0 0 8px;color:#d8b56a;letter-spacing:.16em">启动方式不正确</p>
        <h1 style="margin:0 0 20px;font-size:clamp(28px,6vw,48px)">不能直接打开 index.html</h1>
        <p style="margin:0 0 24px;line-height:1.8;color:#d3d9df">请返回项目根目录，双击“<strong>双击启动试玩.cmd</strong>”。游戏会自动启动服务并打开正确页面。</p>
        <a href="http://localhost:5173" style="display:inline-block;padding:14px 24px;border-radius:999px;background:#b94732;color:white;text-decoration:none;font-weight:700">服务已经启动？打开试玩页</a>
      </div>
    </section>
    <div id="app"></div>
    <script>
      if (window.location.protocol === "file:") {
        document.querySelector("#file-protocol-warning").hidden = false;
        document.querySelector("#app").hidden = true;
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
