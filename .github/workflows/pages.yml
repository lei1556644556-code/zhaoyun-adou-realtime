name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "已通过验收的完整 commit SHA 或 v* 发布标签；回滚时填写旧标签"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_DEPLOY_ENV: production
      # Temporary no-cost playtest endpoint hosted from the owner's PC.
      # Move these public client values back to repository variables when the
      # permanent authority host is selected.
      VITE_SUPABASE_URL: https://dkaabuxszrbnnrajnoaa.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_8UjZAjC-Ts2NiP8_NpmFdA_jv-CEzhd
      VITE_SERVER_URL: https://iso-dragon-fri-phase.trycloudflare.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Re-run release gates for the exact deployment ref
        run: pnpm verify
      - name: Build production client
        run: pnpm build:production
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/client/dist
      - id: deployment
        uses: actions/deploy-pages@v4
